# Pin the project name instead of inheriting it from the directory, so renaming
# or cloning the checkout elsewhere does not silently orphan the volume and the
# network under a different prefix.
name: claude-cli-adapter

services:
  adapter:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.229}

    # The published image. With `image` and `build` both set, `up` reuses a
    # matching local image; failing that it TRIES TO PULL, and only builds if
    # the pull fails. That is a sharp edge worth knowing:
    #
    #   * On amd64, `docker compose up -d` in a fresh checkout SUCCEEDS at
    #     pulling and silently runs the published image, not your local code.
    #     Always pass --build when you mean to test local changes.
    #   * On arm64 the amd64-only pull fails and it falls back to building
    #     natively, which is why it looks like "build by default" here.
    #
    #   dev     docker compose up -d --build
    #   deploy  ADAPTER_IMAGE_TAG=v0.3.0 docker compose pull && docker compose up -d
    #
    # Pin a version tag on anything you care about; :latest moves under you.
    #
    # Published images target linux/amd64 and only that — arm64 is deliberately
    # out of scope, so `pull` failing on a Mac is expected, not a fault. A local
    # dev build tags this same name with the NATIVE arch: never `docker push`
    # that by hand, or an arm64 build lands on a tag servers pull. Use
    # ./release-image.sh, which always sets --platform explicitly.
    image: docker.io/binhphuong/claude-cli-adapter:${ADAPTER_IMAGE_TAG:-latest}
    container_name: claude-cli-adapter
    restart: unless-stopped

    # The adapter has NO authentication of its own — it ignores the API key and
    # will happily serve anyone who can reach it. Bind to loopback only.
    # Change to "0.0.0.0:8082:8082" only behind a reverse proxy that authenticates.
    ports:
      - "127.0.0.1:${ADAPTER_PORT:-8082}:8082"

    # Bare names (no "=") are passed through only when actually set — in the
    # shell or in ./.env. An unset variable is omitted entirely rather than
    # injected empty, which would shadow the credentials file.
    environment:
      # Subscription mode: the login stored in the volume, or a setup-token.
      - CLAUDE_CODE_OAUTH_TOKEN
      # Token mode: point the CLI at an Anthropic-compatible endpoint instead.
      # Set both, or neither. ANTHROPIC_API_KEY is mutually exclusive with
      # ANTHROPIC_AUTH_TOKEN — the entrypoint refuses to start if both are set.
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_AUTH_TOKEN
      - ANTHROPIC_API_KEY
      # Model used when a client sends no "model" field.
      - ADAPTER_DEFAULT_MODEL

    volumes:
      # The whole HOME, not just ~/.claude — Claude Code keeps state in BOTH
      # ~/.claude/ (credentials, projects) and ~/.claude.json (config). Mounting
      # only the directory loses the config file on every recreate.
      - claude-home:/home/app

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # `claude -p` spawns a Node process per request with no concurrency limit
    # in the adapter — cap it here so a burst cannot exhaust the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-home:
